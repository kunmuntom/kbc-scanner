<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>กล้องสแกน | KruBrightClass</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font:18px system-ui,sans-serif;background:#edf3fc;color:#193c60;margin:0;padding:20px}main{max-width:500px;margin:auto;background:white;padding:20px;border-radius:24px}h1{font-size:24px}button{font:inherit;border:0;border-radius:14px;padding:14px;margin:6px 0;background:#185a8b;color:white;width:100%}#reader{border-radius:16px;overflow:hidden}#status{padding:16px;background:#f1edff;border-radius:12px;overflow-wrap:anywhere}small{color:#5d738c}</style></head><body><main><h1>📷 KruBrightClass</h1><p>สแกน QR ประจำตัวนักเรียน</p><div id="reader"></div><p id="status" role="status">กำลังเชื่อมต่อหน้าครู…</p><div id="courses"></div><form id="bonus" hidden><h2 id="person"></h2><p id="old"></p><label>คะแนนที่เพิ่ม<input id="delta" type="number" min="0.01" step="0.01" inputmode="decimal" required style="font:inherit;width:90%;padding:12px"></label><label>เหตุผล<input id="reason" maxlength="200" required style="font:inherit;width:90%;padding:12px"></label><p id="total"></p><button id="save">บันทึกคะแนนและสแกนคนถัดไป</button></form><button id="start" disabled>เปิดกล้องหลัง</button><button id="next" hidden>สแกนใหม่ / คนถัดไป</button><button id="return">กลับหน้าครู</button><button id="stop">หยุดกล้อง</button><small>เช็กชื่อจะบันทึกต่อเนื่อง คะแนนพิเศษเพิ่มและบันทึกในหน้านี้ได้ ส่วนรับงานกลับหน้าครูเพื่อตรวจและบันทึก · เปิดด้วย Safari หรือ Chrome และอนุญาตกล้อง</small></main><script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1)),nonce=params.get('nonce'),parentOrigin=params.get('parent'),mode=params.get('mode'),openerWindow=window.opener,status=document.getElementById('status');
let scanner=null,connected=false,awaiting=false,last='',lastAt=0,person=null,saving=false;
const valid=!!openerWindow&&/^[a-f0-9-]{36}$/i.test(nonce||'')&&/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i.test(parentOrigin||'');
function send(type,extra={}){if(valid)openerWindow.postMessage({type,nonce,...extra},parentOrigin);}
window.addEventListener('message',e=>{
 if(!valid||e.source!==openerWindow||e.origin!==parentOrigin||e.data?.nonce!==nonce)return;
 const box=document.getElementById('courses');
 if(e.data.type==='kbc-bonus-choose'&&mode==='bonus'){awaiting=true;person=null;document.getElementById('bonus').hidden=true;status.textContent=e.data.name+' · เลือกวิชาที่จะให้คะแนน';box.replaceChildren();for(const c of e.data.courses){const b=document.createElement('button');b.textContent=c.label;b.onclick=()=>{box.replaceChildren();send('kbc-bonus-course',{course:c.id});};box.appendChild(b);}return;}
 if(['kbc-bonus-person','kbc-result'].includes(e.data.type))box.replaceChildren();
 if(e.data.type==='kbc-bonus-person'&&mode==='bonus'){person=e.data;awaiting=true;document.getElementById('bonus').hidden=false;document.getElementById('person').textContent=person.name+' · '+person.studentId;document.getElementById('old').textContent='คะแนนพิเศษเดิม '+person.old+' / '+person.max+' · รวม '+person.total+' / 100';document.getElementById('delta').value='';document.getElementById('reason').value='';document.getElementById('total').textContent='';status.textContent='ตรวจชื่อและกรอกคะแนนพิเศษ';return;}
 if(e.data.type!=='kbc-result')return;connected=true;saving=false;document.getElementById('save').disabled=false;document.getElementById('start').disabled=!!scanner;status.textContent=e.data.message;awaiting=!e.data.ready;document.getElementById('next').hidden=e.data.ready;if(e.data.ready){person=null;document.getElementById('bonus').hidden=true;}
});
document.getElementById('delta').oninput=()=>{if(person){const total=(Math.round(person.total*100)+Math.round(Number(document.getElementById('delta').value)*100))/100;document.getElementById('total').textContent='คะแนนรวมหลังเพิ่ม '+total+' / 100'+(total>100?' ⚠ เกิน 100':'');}};
document.getElementById('bonus').onsubmit=e=>{e.preventDefault();if(!person||saving)return;const delta=Number(document.getElementById('delta').value),reason=document.getElementById('reason').value.trim(),over=person.total+delta>100;if(!reason||!Number.isFinite(delta)||delta<=0||Math.abs(delta*100-Math.round(delta*100))>1e-7){status.textContent='กรอกคะแนนมากกว่า 0 ทศนิยมไม่เกินสองตำแหน่ง และเหตุผล';return;}if(person.old+delta>person.max){status.textContent='คะแนนพิเศษสะสมเกินคะแนนเต็มของช่อง';return;}if(over&&!confirm('คะแนนรวมจะเกิน 100 ต้องการเพิ่มหรือไม่?'))return;saving=true;document.getElementById('save').disabled=true;status.textContent='กำลังบันทึก · รอการยืนยันจากระบบครู';send('kbc-bonus-submit',{studentId:person.studentId,delta,reason,confirmedOver:over});};

if(valid){send('kbc-ready');}else status.textContent='กรุณาเปิดหน้าสแกนจากปุ่มในระบบครู';
document.getElementById('start').onclick=async()=>{if(!valid||!connected||scanner)return;if(!window.Html5Qrcode){status.textContent='โหลดตัวอ่าน QR ไม่สำเร็จ ลองเปิดใหม่';return;}try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:240,height:240}},text=>{if(awaiting)return;const now=Date.now();if(text===last&&now-lastAt<2500)return;last=text;lastAt=now;awaiting=true;status.textContent='อ่านแล้ว · รอหน้าครูตรวจสอบและบันทึก';send('kbc-scan',{text});},()=>{});document.getElementById('start').disabled=true;}catch(e){status.textContent='เปิดกล้องไม่ได้: '+(e.message||e)+' · ตรวจสิทธิ์กล้องและเปิดใน Safari/Chrome';if(scanner){try{await scanner.clear();}catch(_){}scanner=null;}}};
document.getElementById('next').onclick=()=>{if(saving)return;person=null;document.getElementById('bonus').hidden=true;awaiting=false;last='';document.getElementById('next').hidden=true;status.textContent='พร้อมสแกนใหม่ (รายการก่อนหน้าอาจยังไม่บันทึก)';};
document.getElementById('return').onclick=()=>{if(openerWindow){openerWindow.focus();status.textContent='หากไม่สลับอัตโนมัติ ให้เลือกแท็บหน้าครูเพื่อกรอกและบันทึก';}};
document.getElementById('stop').onclick=async()=>{if(scanner){try{await scanner.stop();await scanner.clear();}catch(_){}scanner=null;}document.getElementById('start').disabled=!connected;status.textContent='หยุดกล้องแล้ว';};
window.addEventListener('pagehide',()=>{if(scanner)void scanner.stop().catch(()=>{});});
</script></body></html>
